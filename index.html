<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A friendly step challenge leaderboard." />
    <title>Steptember Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow"><span aria-hidden="true">●</span> LIVE CHALLENGE</p>
          <h1>Every step<br />moves us <em>forward.</em></h1>
          <p class="intro">Keep moving, climb the ranks, and make every stride count.</p>
        </div>
        <div class="shoe" aria-hidden="true">👟</div>
      </header>

      <section class="leaderboard" aria-labelledby="leaderboard-title">
        <div class="section-heading">
          <div>
            <p class="kicker">THE STANDINGS</p>
            <h2 id="leaderboard-title">Leaderboard</h2>
          </div>
          <div class="metric"><span>Tracking</span><strong>Steps</strong></div>
        </div>

        <div id="leaderboard-list" class="rankings" aria-live="polite" aria-busy="true">
          <div class="status">Lacing up the leaderboard…</div>
        </div>
      </section>

      <footer>
        <span>STEP BY STEP</span>
        <span aria-hidden="true">✦</span>
        <span>TOGETHER</span>
      </footer>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
